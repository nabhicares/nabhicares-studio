<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nabhi Gemini Paste</title>
  <style>
    :root {
      --ink: #1a2332;
      --muted: #5c6b7a;
      --line: #d8dee6;
      --bg: #f7f9fb;
      --ok: #0d7a4f;
      --err: #b42318;
      --accent: #0b6e4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 380px;
      font: 13px/1.45 system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    main { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea, button {
      width: 100%;
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 8px 10px;
      background: #fff;
    }
    textarea { min-height: 140px; resize: vertical; font-family: ui-monospace, monospace; font-size: 11px; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .msg { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: #fff; border: 1px solid var(--line); }
    .msg.ok { border-color: #9fd4ba; color: var(--ok); }
    .msg.err { border-color: #f0b4ae; color: var(--err); }
    .result img { width: 140px; height: 140px; display: block; margin: 8px auto; background: #fff; }
    .result a { word-break: break-all; color: var(--accent); }
    details { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Nabhi Gemini Paste</h1>
    <p>Maps → Gemini JSON → demo on nabhilabs.info</p>
  </header>
  <main>
    <div>
      <label for="studioUrl">Studio URL</label>
      <input id="studioUrl" type="url" placeholder="https://studio.nabhilabs.info" />
    </div>
    <div>
      <label for="token">Extension token</label>
      <input id="token" type="password" placeholder="nabxt_…" autocomplete="off" />
    </div>
    <div>
      <label for="campaignId">Campaign ID (optional)</label>
      <input id="campaignId" type="text" placeholder="from Studio CRM" />
    </div>
    <div>
      <label for="mapsUrl">Maps URL (optional)</label>
      <input id="mapsUrl" type="url" placeholder="https://maps.google.com/…" />
    </div>
    <div>
      <label for="json">Gemini JSON</label>
      <textarea id="json" placeholder='{ "hospital": { "name": "…" }, "sections": { … } }'></textarea>
    </div>
    <div class="row">
      <button type="button" class="secondary" id="copyPrompt">Copy Gemini prompt</button>
      <button type="button" id="submit">Create + publish</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;color:var(--ink)">
      <input id="doPublish" type="checkbox" checked style="width:auto" />
      Enqueue publish
    </label>
    <div id="status" hidden class="msg"></div>
    <div id="result" hidden class="result msg ok"></div>
    <details>
      <summary>Setup</summary>
      <ol>
        <li>Studio → CRM → Issue token</li>
        <li>Paste token here (saved in this browser)</li>
        <li>Copy Gemini prompt → paste Maps details into Gemini → paste JSON above</li>
      </ol>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
