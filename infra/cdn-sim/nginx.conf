worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Local stand-in for a real CDN (Cloudflare/CloudFront). It only ever serves
  # the "current" pointer for a hospital, never a specific version directly -
  # that mirrors how rollback works in production: the worker flips the
  # pointer, the CDN just serves whatever the pointer points to.

  # Docker embedded DNS - required because proxy_pass uses $variables
  # (regex captures), which forces runtime resolution.
  resolver 127.0.0.11 ipv6=off valid=10s;

  upstream minio_s3 {
    server minio:9000;
  }

  server {
    listen 80;

    # Draft/media assets (survive outside publish pointer)
    location ~ ^/(?<hospital_id>[a-zA-Z0-9-]+)/assets/(?<object_path>.+)$ {
      proxy_pass http://minio_s3/nabhicares-sites/$hospital_id/assets/$object_path;
      proxy_set_header Host minio:9000;
      proxy_http_version 1.1;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Served-By "nabhicares-cdn-sim";
    }

    # Request: http://localhost:8080/{hospital_id}/
    # Proxies to: MinIO object at nabhicares-sites/{hospital_id}/current/
    location ~ ^/(?<hospital_id>[a-zA-Z0-9-]+)/(?<path>.*)$ {
      set $object_path $path;
      if ($object_path = "") {
        set $object_path "index.html";
      }
      if ($object_path ~ "/$") {
        set $object_path "${object_path}index.html";
      }

      proxy_pass http://minio_s3/nabhicares-sites/$hospital_id/current/$object_path;
      proxy_set_header Host minio:9000;
      proxy_http_version 1.1;
      add_header Cache-Control "public, max-age=60";
      add_header X-Served-By "nabhicares-cdn-sim";
    }

    location = / {
      return 200 "nabhicares CDN simulator - request /{hospital_id}/ to view a published site\n";
      add_header Content-Type text/plain;
    }
  }
}
