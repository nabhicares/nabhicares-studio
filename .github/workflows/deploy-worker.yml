name: Deploy publish-worker

# Builds and pushes the worker image. Configure secrets:
#   REGISTRY, IMAGE_NAME, REGISTRY_USERNAME, REGISTRY_PASSWORD
on:
  push:
    branches: [main, master]
    paths:
      - 'apps/publish-worker/**'
      - 'packages/**'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Skip if registry not configured
        id: check
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "REGISTRY secret empty — skipping image push (configure to enable)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          file: apps/publish-worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
            ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}
